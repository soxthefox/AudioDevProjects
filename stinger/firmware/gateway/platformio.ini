; Gateway: USB serial from the laptop <-> ESP-NOW to the bars.

[platformio]
default_envs = native

[shared]
lib_deps =
    symlink://../../protocol

[env:native]
platform = native
test_framework = unity
lib_deps = ${shared.lib_deps}
build_flags =
    -Wall -Wextra -Werror
    -I${PROJECT_DIR}/../../protocol/vectors

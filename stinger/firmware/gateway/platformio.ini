; Gateway: USB serial from the laptop <-> ESP-NOW to the bars.
; Hardware and timing facts are build flags; they must match config/installation.yaml.

[platformio]
default_envs = esp32dev

[shared]
lib_deps =
    symlink://../../protocol
    symlink://../common

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
lib_deps = ${shared.lib_deps}
build_flags =
    -Wall -Wextra
    -DSTINGER_SERIAL_BAUD=921600
    -DSTINGER_SERIAL_RX_BUFFER=4096
    -DSTINGER_STATS_INTERVAL_MS=1000
    -DSTINGER_CONFIG_RETRIES=3
    -DSTINGER_OFFLINE_AFTER_MS=3000
    -DSTINGER_ESPNOW_CHANNEL=1
    -DSTINGER_ESPNOW_PHY_RATE=WIFI_PHY_RATE_6M
    -DSTINGER_ESPNOW_ACK_TIMEOUT_MS=50
    -DSTINGER_ESPNOW_RX_QUEUE=16

[env:native]
platform = native
test_framework = unity
lib_deps = ${shared.lib_deps}
build_flags =
    -std=gnu++17
    -Wall -Wextra -Werror
    -I${PROJECT_DIR}/../../protocol/vectors
    -I${PROJECT_DIR}/../common/test_support

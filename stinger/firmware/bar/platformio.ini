; Bar: ESP-NOW from the gateway -> 60 x WS2812B via FastLED.
; Hardware and timing facts are build flags; they must match config/installation.yaml.

[platformio]
default_envs = esp32dev

[shared]
lib_deps =
    symlink://../../protocol
    symlink://../common

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ${shared.lib_deps}
    fastled/FastLED@3.9.4
build_flags =
    -Wall -Wextra
    -DSTINGER_LED_COUNT=60
    -DSTINGER_DATA_PIN=16
    -DSTINGER_BRIGHTNESS_HARD_LIMIT=178
    -DSTINGER_LED_VOLTS=5
    -DSTINGER_LED_MAX_MA=3000
    -DSTINGER_FAILSAFE_TIMEOUT_MS=2000
    -DSTINGER_FAILSAFE_FADE_MS=500
    -DSTINGER_HELLO_INTERVAL_MS=1000
    -DSTINGER_FW_VERSION=0x0100
    -DSTINGER_ESPNOW_CHANNEL=1
    -DSTINGER_ESPNOW_PHY_RATE=WIFI_PHY_RATE_6M
    -DSTINGER_ESPNOW_ACK_TIMEOUT_MS=50
    -DSTINGER_ESPNOW_RX_QUEUE=16

[env:native]
platform = native
test_framework = unity
lib_deps = ${shared.lib_deps}
build_flags =
    -std=gnu++17
    -Wall -Wextra -Werror
    -I${PROJECT_DIR}/../common/test_support

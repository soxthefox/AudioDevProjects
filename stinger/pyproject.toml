[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stinger"
version = "0.1.0"
description = "Light Installation - Stinger: protocol, simulator, bridge and tools (Layer 1)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
stinger-sim = "stinger_sim.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "platformio>=6.1"]

[tool.setuptools.package-dir]
stinger_proto = "protocol/stinger_proto"
stinger_config = "config/stinger_config"
stinger_sim = "sim/stinger_sim"
stinger_bridge = "bridge/stinger_bridge"

[tool.setuptools.package-data]
stinger_sim = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".pio", "firmware"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
